[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ha-virtual-boiler-water-meter"
version = "0.1.0"
description = "Home Assistant integration to estimate hot water consumption from heating energy"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "rambobinator"}]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "C4",   # flake8-comprehensions
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
]
ignore = [
    "E501",  # line too long
]

[tool.ruff.lint.isort]
profile = "black"
